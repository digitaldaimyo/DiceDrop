<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dice Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --ink:#2a1b4d; --ink2:#5b4b85; --cream:#fffaf2; --panel:rgba(255,250,242,.92);
  --orange:#ff9f1c; --orange-d:#d9720b; --pink:#ff4f8b; --pink-d:#c92c66; --teal:#1fc8b4; --teal-d:#11917f;
  --violet:#7b5cff; --violet-d:#5638d6; --gold:#ffd23f; --good:#2fd17a;
  --font:'Fredoka','Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1238;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:var(--font);border:0;cursor:pointer;color:inherit}

/* chunky buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:18px;
  padding:12px 20px;border-radius:18px;color:#fff;background:linear-gradient(180deg,#ffb547,var(--orange));
  box-shadow:0 5px 0 var(--orange-d),0 8px 18px rgba(40,10,80,.25);text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-d),0 3px 8px rgba(40,10,80,.25)}
.btn.pink{background:linear-gradient(180deg,#ff7aa8,var(--pink));box-shadow:0 5px 0 var(--pink-d),0 8px 18px rgba(40,10,80,.25)}
.btn.teal{background:linear-gradient(180deg,#4fe0cf,var(--teal));box-shadow:0 5px 0 var(--teal-d),0 8px 18px rgba(40,10,80,.25)}
.btn.violet{background:linear-gradient(180deg,#9c84ff,var(--violet));box-shadow:0 5px 0 var(--violet-d),0 8px 18px rgba(40,10,80,.25)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d8cfe8,0 8px 18px rgba(40,10,80,.15);text-shadow:none}
.btn.small{font-size:15px;padding:8px 14px;border-radius:14px}
.btn[disabled]{filter:grayscale(.85) brightness(1.05);opacity:.75;pointer-events:none}
.icon-btn{width:46px;height:46px;border-radius:15px;background:#fff;box-shadow:0 4px 0 #d8cfe8,0 6px 14px rgba(40,10,80,.18);display:grid;place-items:center;font-size:20px;font-weight:700}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d8cfe8}
.icon-btn svg{width:24px;height:24px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:10px 10px 0;pointer-events:none;z-index:5}
#hud .bar{display:flex;align-items:center;gap:8px}
#hud .bar>*{pointer-events:auto}
.pill{background:var(--panel);border-radius:16px;padding:6px 12px;font-weight:700;box-shadow:0 4px 14px rgba(40,10,80,.18);display:flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
#lvl-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
#lvl-name small{display:block;font-size:11px;color:var(--ink2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#score-pill{font-size:18px;min-width:84px;justify-content:center}
#rolls-pill{font-size:18px}
#rolls-pill svg{width:20px;height:20px}
#goals{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#goals .goal{pointer-events:auto;cursor:pointer}
.teach{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 3px 0 #ebe3f6}
.teach-title{font-weight:700;font-size:17px;margin-bottom:8px}
.teach-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.teach-panel{display:flex;flex-direction:column;align-items:center;gap:4px;background:#f6f1ff;border-radius:14px;padding:8px 6px}
.teach-panel .cap{font-size:13px;font-weight:600;text-align:center;line-height:1.2}
.teach-note{margin-top:10px;font-size:14px;color:var(--ink2);font-weight:500}
.goal{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;padding:4px 10px 4px 5px;font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(40,10,80,.16);transition:transform .2s}
.goal.done{background:#d9ffe9;color:#138a4c}
.goal.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.25)}100%{transform:scale(1)}}
.gicon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.goal .check{color:var(--good);font-size:16px}

#bottombar{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:10px;z-index:5;pointer-events:none}
#bottombar>*{pointer-events:auto}
#roll-btn{font-size:24px;padding:14px 30px;min-width:170px;border-radius:22px}
#roll-btn.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#roll-btn .sub{display:block;font-size:12px;font-weight:600;opacity:.9}
#roll-btn .col{display:flex;flex-direction:column;align-items:center;line-height:1.05}
#undo-btn .lbl{font-size:10px;font-weight:700;margin-top:-2px}
#undo-btn{flex-direction:column;width:58px;height:58px}

#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:8px 14px;border-radius:14px;font-weight:600;font-size:15px;z-index:6;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:hintbob 1.4s ease-in-out infinite;white-space:nowrap}
@keyframes hintbob{0%,100%{margin-bottom:0}50%{margin-bottom:6px}}

/* FX overlay */
#fx{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.floater{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(40,10,80,.6),0 0 12px rgba(255,255,255,.6);animation:floatup 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-weight:700;white-space:nowrap;color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:2px rgba(40,10,80,.35);text-shadow:0 5px 0 rgba(40,10,80,.45),0 0 30px rgba(255,200,80,.8);animation:banner 1.1s cubic-bezier(.2,1.6,.4,1) forwards}
.banner.c2{font-size:40px;color:#fff6a8}.banner.c3{font-size:48px;color:#ffd166}.banner.c4{font-size:54px;color:#ff9f6b}.banner.c5{font-size:58px;color:#ff6bd6}
.banner.big{font-size:64px;color:#fff}.banner.twenty{font-size:62px;color:#ffe066}.banner.line{font-size:44px;color:#9ff7ff}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}45%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.05)}}
.coin{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffd23f 45%,#e09a00);box-shadow:0 0 12px #ffd23f;transform:translate(-50%,-50%)}

/* Screens & modals */
.screen{position:fixed;inset:0;z-index:10;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#screen-map{background:linear-gradient(180deg,rgba(27,18,56,0) 0%,rgba(27,18,56,0) 30%,rgba(27,18,56,.35) 100%)}
.map-inner{max-width:520px;margin:0 auto;padding:14px 14px 60px}
.map-top{display:flex;align-items:center;gap:8px}
.gems{font-weight:700;font-size:18px}
.gem-ico{width:20px;height:20px;display:inline-block;vertical-align:-4px}
.logo{margin:24px 0 6px;text-align:center;font-size:58px;font-weight:700;line-height:.9;color:#fff;letter-spacing:.01em;
  -webkit-text-stroke:3px #2a1b4d;paint-order:stroke fill;text-shadow:0 7px 0 #2a1b4d,0 14px 24px rgba(0,0,0,.35)}
.logo span{display:inline-block;animation:logo 2.6s ease-in-out infinite}
@keyframes logo{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
.tagline{text-align:center;color:#fff;font-weight:600;text-shadow:0 2px 0 rgba(40,10,80,.5);margin-bottom:180px}
.world{background:var(--panel);border-radius:28px;padding:16px 14px 22px;margin:18px 0;box-shadow:0 10px 30px rgba(20,5,50,.3)}
.world h2{margin:0;font-size:24px}
.world p{margin:2px 0 8px;color:var(--ink2);font-weight:500}
.world .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;color:#fff;margin-bottom:6px}
.path{position:relative;display:flex;flex-direction:column;gap:10px;padding:6px 0}
.node-row{display:flex;justify-content:center}
.node{width:72px;height:72px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff;position:relative;
  background:linear-gradient(180deg,#9c84ff,var(--violet));box-shadow:0 6px 0 var(--violet-d),0 10px 18px rgba(40,10,80,.25);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--violet-d)}
.node.won{background:linear-gradient(180deg,#4fe0cf,var(--teal));box-shadow:0 6px 0 var(--teal-d),0 10px 18px rgba(40,10,80,.25)}
.node.next{background:linear-gradient(180deg,#ffb547,var(--orange));box-shadow:0 6px 0 var(--orange-d),0 10px 18px rgba(40,10,80,.25);animation:pulse 1.2s infinite}
.node.locked{background:#cfc7dd;box-shadow:0 6px 0 #a99fbe;color:#8d82a6}
.node .stars{position:absolute;bottom:-14px;display:flex;gap:1px}
.node .stars svg{width:17px;height:17px}
.node .boss{position:absolute;top:-10px;right:-10px;background:var(--pink);font-size:10px;padding:2px 6px;border-radius:8px;box-shadow:0 2px 0 var(--pink-d)}

#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,8,45,.5);backdrop-filter:blur(3px);animation:fade .2s}
#modal.center{align-items:center}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--cream);border-radius:30px 30px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .32s cubic-bezier(.2,1.3,.4,1)}
#modal.center .sheet{border-radius:30px;margin:16px;width:calc(100% - 32px)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h1{margin:0 0 4px;font-size:30px;text-align:center}
.sheet h3{margin:16px 0 8px;font-size:16px;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em}
.sheet .sub{text-align:center;color:var(--ink2);font-weight:600;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.row.center{justify-content:center}
.row.wrap{flex-wrap:wrap}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.tip{background:#efe7ff;border-radius:16px;padding:10px 14px;font-weight:500;margin-top:12px}
.goal-list{display:flex;flex-direction:column;gap:8px}
.goal-big{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 14px;font-weight:600;font-size:17px;box-shadow:0 3px 0 #ebe3f6}
.goal-big .gicon{width:38px;height:38px;font-size:19px;border-radius:11px}
.dice-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.die-card{position:relative;width:76px;padding:8px 4px 8px;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e3dbef;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px}
.die-card:active{transform:translateY(3px);box-shadow:0 1px 0 #e3dbef}
.die-card svg.die{width:44px;height:44px}
.die-card .emp{font-size:10px;padding:1px 6px;border-radius:8px;color:#fff;font-weight:700;white-space:nowrap}
.die-card.in{outline:3px solid var(--orange);outline-offset:-3px}
.die-card .inbadge{position:absolute;top:-6px;right:-4px;background:var(--orange);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px}
.slot{width:76px;height:96px;border-radius:18px;border:3px dashed #cbbfe0;display:grid;place-items:center;color:#b3a6cc;font-weight:700}
.tabs{display:flex;gap:6px;background:#efe7ff;border-radius:16px;padding:4px;margin:6px 0 4px}
.tabs button{flex:1;padding:9px;border-radius:12px;font-weight:700;font-size:16px;background:transparent;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 #d8cfe8}
.shop-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 #ebe3f6;margin-bottom:8px}
.shop-item .info{flex:1}
.shop-item .info b{display:block;font-size:17px}
.shop-item .info span{font-size:13px;color:var(--ink2);font-weight:500}
.emp-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.emp-ico svg{width:24px;height:24px}
.choice{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;margin-bottom:8px;box-shadow:0 3px 0 #ebe3f6;width:100%;text-align:left;font-weight:600;font-size:15px}
.choice.on{outline:3px solid var(--teal);outline-offset:-3px}
.choice[disabled]{opacity:.45}
.stars-big{display:flex;justify-content:center;gap:8px;margin:8px 0 4px}
.stars-big svg{width:66px;height:66px;opacity:.25;transform:scale(.6);transition:none}
.stars-big svg.on{opacity:1;animation:stamp .5s cubic-bezier(.2,1.8,.4,1) forwards}
.stars-big svg:nth-child(2){margin-top:-14px}
@keyframes stamp{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.score-big{text-align:center;font-size:40px;font-weight:700}
.reward{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff3c4,#ffe0f0);border-radius:18px;padding:12px 14px;margin-top:12px;font-weight:600;animation:bump .6s .8s both}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;font-weight:600;font-size:17px;box-shadow:0 3px 0 #ebe3f6}
.sw{width:52px;height:30px;border-radius:999px;background:#d8cfe8;position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--teal)}
.sw.on::after{left:25px}
#pop{position:fixed;z-index:15;transform:translate(-50%,-100%);background:var(--cream);border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px rgba(20,5,50,.35);min-width:190px;animation:up .2s}
#pop::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-bottom:0;border-top-color:var(--cream)}
#pop b{display:block;font-size:16px}
#pop span{display:block;font-size:13px;color:var(--ink2);margin:2px 0 8px;font-weight:500}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;z-index:30;animation:fade .2s;max-width:86vw;text-align:center}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#5b3fc4,#1b1238);color:#fff;font-weight:700;font-size:22px}
#loading .spin{width:54px;height:54px;margin:0 auto 14px;border-radius:12px;background:var(--orange);box-shadow:0 5px 0 var(--orange-d);animation:spin 1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.logo span,#hint{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fx"></div>
<div id="hud" class="hidden">
  <div class="bar">
    <button class="icon-btn" id="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    <div class="pill" id="lvl-name"></div>
    <div class="pill" id="rolls-pill"></div>
    <div class="pill" id="score-pill">0</div>
  </div>
  <div id="goals"></div>
</div>
<div id="bottombar" class="hidden">
  <button class="btn ghost icon-btn" id="undo-btn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="lbl">UNDO</span></button>
  <button class="btn" id="roll-btn"></button>
  <div style="width:58px"></div>
</div>
<div id="hint" class="hidden"></div>
<div id="screen-map" class="screen hidden"></div>
<div id="loading"><div><div class="spin"></div>Loading dice…</div></div>
<script>setTimeout(function(){var l=document.getElementById("loading");if(l)l.innerHTML="<div style=\"text-align:center;padding:24px\">Couldn't start the 3D engine.<br><small style=\"font-weight:500\">Check your connection and that WebGL is enabled, then reload.</small></div>";},15000);</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---- logic ----
const L = (() => {
// ===== Dice Drop: pure game rules (no rendering) =====
const SIDES = { d2: 2, d4: 4, d6: 6, d8: 8, d10: 10, d12: 12, d20: 20 };
const MAX_V = 20;

function rnd(s) {
  s.rs = (s.rs + 0x6d2b79f5) | 0;
  let t = s.rs;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rint = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));

const idx = (s, x, y) => y * s.w + x;
const at = (s, x, y) => (x < 0 || y < 0 || x >= s.w || y >= s.h ? null : s.cells[idx(s, x, y)]);
const isHole = (s, x, y) => !!s.holes[idx(s, x, y)];

function parseLevel(level) {
  const rows = level.rows.map(r => r.trim().split(/\s+/));
  const h = rows.length, w = rows[0].length;
  return { w, h, rows };
}

function createGame(level, dice, seed = (Math.random() * 2 ** 31) | 0) {
  const { w, h, rows } = parseLevel(level);
  const s = {
    w, h, cells: new Array(w * h).fill(null), holes: new Array(w * h).fill(0),
    nextId: 1, rs: seed | 0, tray: [], dice: dice.map(d => ({ ...d })),
    rollsLeft: level.rolls, rollsTotal: level.rolls, score: 0,
    prog: { broken: {}, total: 0, bursts: 0, lines: 0, ice: 0, stone: 0, bombs: 0, maxCombo: 0 },
    goals: level.goals.map(g => ({ ...g })), status: 'roll', turn: 0,
  };
  for (let r = 0; r < h; r++) {
    const y = h - 1 - r;
    for (let x = 0; x < w; x++) {
      const t = rows[r][x];
      const i = idx(s, x, y);
      if (t === '.') continue;
      if (t === '#') { s.holes[i] = 1; continue; }
      if (t === 'S') { s.cells[i] = { id: s.nextId++, k: 's', v: 0, ice: 0, blaze: 0 }; continue; }
      if (t === 'w') { s.cells[i] = { id: s.nextId++, k: 'w', v: 0, ice: 0, blaze: 0 }; continue; }
      let ice = 0, bomb = 0, v = t;

function startMusic() {

    if (!AC.ctx) return;

      const bar = Math.floor(n / 8) % 4, ch = chords[bar], k = n % 8;

function fitCamera() {
  const aspect = innerWidth / innerHeight; camera.aspect = aspect; camera.updateProjectionMatrix();
  if (mode !== 'play' || !layout.bw) {
    camBase.look.set(0, 1.2, 0); camBase.pos.set(0, 4.5, aspect < 0.8 ? 19 : 14); return;
  }
  const top = hudTop(), bot = hudBottom(), usable = Math.max(0.4, (innerHeight - top - bot) / innerHeight);
  const halfW = Math.max(layout.bw / 2 + 0.8, layout.trayW / 2 + 0.2) + 0.15;
  const y0 = -2.35, y1 = layout.bh + 0.75;
  const Hc = (y1 - y0) / usable, cy = (y0 + y1) / 2;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(Hc / 2 / tanH, halfW / (tanH * aspect)) * 1.04;
  const worldPerPx = (2 * dist * tanH) / innerHeight;
  const shiftY = ((top - bot) / 2) * worldPerPx;
  const tilt = 0.2;
  camBase.look.set(0, cy + shiftY, 0.2);
  camBase.pos.set(0, cy + shiftY + Math.sin(tilt) * dist, Math.cos(tilt) * dist + 0.2);
}

// ---- step playback ----
async function playSteps(steps, ti) {
  for (const st of steps) {
    if (st.type === 'place') { await playPlace(st, ti); updateBands(steps.length === 1); }
    else await playResolve(st);
  }
}
async function playPlace(st, ti) {
  const dv = trayViews[ti]; const target = cellPos(st.x, st.y);
  vibrate(12);

    dv.state = 'flying';
    const from = dv.g.position.clone();
    if (st.mode === 'drop') {
      const above = new THREE.Vector3(target.x, Math.max(from.y, S.h + 0.6), 0.4);
      await tween(150, e => dv.g.position.lerpVectors(from, above, e), E.outQuad);
      await tween(140 + 22 * (above.y - target.y), e => { dv.g.position.lerpVectors(above, new THREE.Vector3(target.x, target.y, 0.2), e); dv.mesh.rotation.z += 0.3; }, E.inQuad);
    } else {
      const front = new THREE.Vector3(target.x, target.y + 0.2, 1.1);
      await tween(160, e => dv.g.position.lerpVectors(from, front, e), E.outQuad);
      await tween(90, e => { dv.g.position.lerpVectors(front, target, e); dv.g.scale.setScalar(1 - e * 0.7); }, E.inQuad);
    }
    dv.g.visible = false; dv.state = 'placed';

    v = makeBlockView({ id: st.id, k: st.k || 'n', v: st.v, ice: 0, blaze: st.die.emp === 'blazing' ? 1 : 0 }, st.x, st.y);
    sfx.thunk(); addShake(0.06);
    spawnSparks(new THREE.Vector3(target.x, target.y - 0.45, 0.3), '#ffffff', 8, 1.6, 0.3, 0.4);
    if (st.k === 'w') spawnSparks(target, EMPS.wild.color, 16, 2.5, 0.4, 0.6, 0, starTex);
    if (st.extra) {
      const e = st.extra, v2 = makeBlockView({ id: e.id, k: 'n', v: e.v, ice: 0, blaze: 0 }, e.x, e.y), p2 = cellPos(e.x, e.y);
      v2.g.position.copy(target); tween(220, k => v2.g.position.lerpVectors(target, p2, k), E.outBack).then(() => squash(v2, 0.35, 280));
      spawnSparks(target, EMPS.split.color, 14, 2.5, 0.35, 0.5); sfx.pop();
    }
    await squash(v, 0.4, 320);
  } else if (v) {
    sfx.thunk(0.7); addShake(0.05);
    if (st.die.emp === 'blazing') setBlaze(v, true);
    const steps = st.v - st.from, nTicks = Math.min(Math.abs(steps), 12);
    squash(v, 0.3, 300);
    for (let i = 1; i <= nTicks; i++) {
      setVal(v, Math.round(st.from + (steps * i) / nTicks)); sfx.tick(i);
      await wait(32);
    }
    setVal(v, st.v);
    if (st.die.emp === 'heavy') { addShake(0.12); spawnSparks(target, EMPS.heavy.color, 14, 2.5, 0.35, 0.5); }
    if (st.v === 20) { v.body.material.emissive.set('#ffcc33'); v.body.material.emissiveIntensity = 1.5; }
  }
}
async function playResolve(st) {

    const cls = combo >= 5 ? 'c5' : 'c' + combo;
    const words = ['', '', 'Combo ×2!', 'Cascade ×3!', 'Mega ×4!', 'Dice-tastic ×' + combo + '!'];
    banner(words[Math.min(combo, 5)], cls); bgU.glow.value = Math.min(1.5, 0.4 * combo);
  }
  // flash phase
  const flashIds = new Set([...st.cleared.map(c => c.id), ...st.thaws.map(t => t.id)]);
  const fl = [...flashIds].map(id => views.get(id)).filter(Boolean);
  await tween(130, e => fl.forEach(v => {
    v.g.scale.setScalar(1 + 0.14 * e);
    if (v.k === 'n') { v.body.material.emissive.set('#ffffff'); v.body.material.emissiveIntensity = 0.9 * e; }
  }), E.outQuad);
  // bursts
  if (st.bursts.length) {
    hitstop(90); sfx.boom(); addShake(0.38); vibrate([30, 20, 40]);
    banner('TWENTY!', 'twenty');

      const p = cellPos(x, y); spawnRing(p, '#ffd23f', 5, 0.55); spawnRing(p, '#ff7a1a', 3, 0.4);
      spawnSparks(p, '#ffe066', 30, 6, 0.45, 0.7, 2); spawnSparks(p, '#ff7a1a', 16, 4, 0.5, 0.6);
    }
  }
  if (st.blasts && st.blasts.length) {
    hitstop(70); sfx.boom(); addShake(0.45); vibrate([40, 20, 60]);
    if (!st.bursts.length) banner(st.blasts.length > 1 ? `BOOM ×${st.blasts.length}!` : 'BOOM!', 'twenty');
    for (const [x, y] of st.blasts) {
      const p = cellPos(x, y); spawnRing(p, '#ff7a1a', 6, 0.6); spawnRing(p, '#ffd23f', 3.5, 0.45);
      spawnSparks(p, '#ff9a3c', 34, 6.5, 0.5, 0.8, 2); spawnSparks(p, '#3a2f45', 14, 3, 0.55, 0.9, 1); spawnShards(p, '#2b2235', 10, 4.5);
    }
  }

    st.lines.forEach(spawnLaser);

    const a = cellPos(...b.from), c = cellPos(...b.to);

    sfx.fizz();
  }
  // decrements (burst neighbors)
  for (const d of st.decs) {
    const v = views.get(d.id); if (!v) continue;
    setVal(v, d.v); squash(v, 0.25, 260); floatText('-1', cellPos(d.x, d.y).add(new THREE.Vector3(0, 0.3, 0.5)), { color: '#ffd0d0', size: 18 });
  }
  if (st.bursts.length || st.lines.length || (st.blasts && st.blasts.length)) await wait(140);
  // shatter
  const groupSize = st.cleared.length;
  if (groupSize) {
    sfx.chime(combo, Math.min(groupSize, 4)); vibrate(20);
    const center = new THREE.Vector3();
    for (const c of st.cleared) {
      const v = views.get(c.id), p = cellPos(c.x, c.y);
      center.add(p);
      const col = c.k === 's' ? '#9a93ad' : c.k === 'w' ? EMPS.wild.color : valColor(clamp(c.v, 1, 20));
      spawnShards(p, col, reduced() ? 5 : 11, 3.4);
      spawnSparks(p, c.k === 's' ? '#ffffff' : col, 6, 2.5, 0.35, 0.5, 0, starTex);
      if (c.ice) spawnShards(p, '#d4f1ff', 6, 3);
      if (v) { boardGroup.remove(v.g); views.delete(c.id); }
    }
    center.multiplyScalar(1 / groupSize);
    if (st.gained) floatText('+' + st.gained, center.add(new THREE.Vector3(0, 0.2, 0.8)), { size: 22 + Math.min(18, combo * 4) });
    for (const g of st.groups) if (g.cells.length >= 5) { banner('BIG MATCH!', 'big'); break; }
    addShake(0.08 + 0.03 * combo);
  }
  // thaws
  if (st.thaws.length) sfx.crack();
  for (const t of st.thaws) {
    const v = views.get(t.id); if (!v) continue;
    if (v.ice) { v.g.remove(v.ice); v.ice = null; }
    spawnShards(cellPos(t.x, t.y), '#d4f1ff', 12, 3.2); spawnSparks(cellPos(t.x, t.y), '#9fe4ff', 10, 2.5, 0.35, 0.5);
  }
  // restore flash on remaining
  for (const v of fl) if (views.has(v.id)) { v.g.scale.setScalar(1); if (v.k === 'n') { v.body.material.emissive.set(v.blaze ? '#ff6a00' : '#000000'); v.body.material.emissiveIntensity = v.blaze ? 0.45 : 1; } }
  updateHUD(); updateBands(false);
  await wait(110);
  // gravity
  if (st.moves.length) {
    const jobs = st.moves.map(m => {
      const v = views.get(m.id); if (!v) return null;
      const a = cellPos(m.x, m.from), b = cellPos(m.x, m.to); v.x = m.x; v.y = m.to;
      return tween(110 + 55 * (m.from - m.to), e => v.g.position.lerpVectors(a, b, e), E.inQuad).then(() => squash(v, 0.22, 240));

    await Promise.all(jobs.filter(Boolean));
    sfx.thunk(0.4);
  }
  // keep grid positions in sync

    const b = L.at(S, x, y); if (!b) continue; const v = views.get(b.id);
    if (v) { v.x = x; v.y = y; }
  }
  updateBands();
  await wait(60);
}

// win / lose
async function winSequence() {
  busy = true; hint(''); updateHUD();
  sfx.win(); banner('GOAL!', 'big'); vibrate([40, 30, 60]);
  spawnConfetti(new THREE.Vector3(0, S.h * 0.6, 1), 90, 7);
  const prevStars = P.stars[level.key] || 0;
  // bonus coins for rolls left
  const rb = $('#roll-btn').getBoundingClientRect(), sp = $('#score-pill').getBoundingClientRect();
  for (let i = 0; i < S.rollsLeft; i++) {
    const c = document.createElement('div'); c.className = 'coin'; fxLayer.appendChild(c);
    const x0 = rb.left + rb.width / 2, y0 = rb.top, x1 = sp.left + sp.width / 2, y1 = sp.top + sp.height / 2;
    tween(600, e => { c.style.left = lerp(x0, x1, e) + 'px'; c.style.top = (lerp(y0, y1, e) - Math.sin(e * Math.PI) * 120) + 'px'; }, E.inOutCubic).then(() => { c.remove(); sfx.coin(); S.score += 150; animateScore(); });
    await wait(180);
  }
  await wait(700);
  for (let i = 0; i < 5; i++) { setTimeout(() => { const p = new THREE.Vector3(rand(-S.w / 2, S.w / 2), rand(S.h * 0.5, S.h + 1), 0.8); spawnSparks(p, CONF[i % CONF.length], 26, 5, 0.4, 0.9, 2); sfx.pop(); }, i * 180); }
  // the bonus coins already added rollsLeft*150 to S.score, so compute stars on the bonus-included score
  const final = S.score;
  const stars = 1 + (S.rollsLeft >= 2 ? 1 : 0) + (final >= level.star3 ? 1 : 0);
  const newStars = Math.max(0, stars - prevStars);
  const gems = newStars * GEMS_PER_STAR;
  P.stars[level.key] = Math.max(prevStars, stars); P.best[level.key] = Math.max(P.best[level.key] || 0, final); P.gems += gems;
  let rewardHtml = '';
  if (!prevStars && level.reward) rewardHtml = grantReward(level.reward);
  save();
  await wait(900);
  const idx = levelIndex(level.key), next = LEVELS[idx + 1];
  openModal(`<h1>Level Clear!</h1><div class="sub">${esc(level.id)} · ${esc(level.name)}</div>
    <div class="stars-big">${[0, 1, 2].map(i => ICON.star(true)).join('')}</div>
    <div class="score-big">${final}</div>
    <div class="sub">${S.rollsLeft} roll${S.rollsLeft === 1 ? '' : 's'} left · 3★ at ${level.star3}</div>
    ${gems ? `<div class="row center" style="font-weight:700;font-size:20px">${ICON.gem} +${gems} gems</div>` : ''}
    ${rewardHtml}
    <div class="actions"><button class="btn ghost" data-act="map">Map</button><button class="btn violet" data-act="retry">Replay</button>${next ? `<button class="btn" data-act="next">Next ▶</button>` : ''}</div>`, { center: true, dismiss: false });
  const svgs = document.querySelectorAll('.stars-big svg');
  for (let i = 0; i < stars; i++) { await wait(350); svgs[i] && svgs[i].classList.add('on'); sfx.star(i); vibrate(25); }
  busy = false;
}
function grantReward(r) {
  if (r.die) {
    const d = { id: P.nextDie++, type: r.die, emp: null }; P.dice.push(d);
    if (!P.unlockedDice.includes(r.die)) P.unlockedDice.push(r.die);
    if (P.loadout.length < P.slots) P.loadout.push(d.id);
    return `<div class="reward">${dieSvg(r.die)}<div><b>New die: ${DIE_INFO[r.die].name}!</b><br>${DIE_INFO[r.die].role}. More in the shop.</div></div>`;
  }
  if (r.emp) {
    P.emps[r.emp] = (P.emps[r.emp] || 0) + 1;
    if (!P.unlockedEmps.includes(r.emp)) P.unlockedEmps.push(r.emp);
    return `<div class="reward">${empIcon(r.emp)}<div><b>Empowerment: ${EMPS[r.emp].name}!</b><br>${EMPS[r.emp].desc} Attach it in Dice.</div></div>`;
  }
  if (r.slot) {
    P.slots += r.slot;
    const free = P.dice.find(d => !P.loadout.includes(d.id)); if (free && P.loadout.length < P.slots) P.loadout.push(free.id);
    return `<div class="reward"><div class="emp-ico" style="background:var(--orange)">+1</div><div><b>Loadout slot!</b><br>You can now bring ${P.slots} dice.</div></div>`;
  }
  return '';
}

// =============== input ===============
let drag = null;
const canvas = renderer.domElement;
const DRAG_OFFSET = 74;
function nearestDie(x, y) {
  let best = null, bd = 1e9;
  trayViews.forEach((v, i) => {
    if (!v || !v.g.visible || S.tray[i].placed || v.state !== 'idle') return;
    const p = toScreen(v.g.position), d = Math.hypot(p.x - x, p.y - y);
    if (d < bd) { bd = d; best = i; }
  });
  const lim = Math.max(46, Math.min(80, innerWidth / (trayViews.length + 1) / 1.6));
  return bd < lim ? best : null;
}
canvas.addEventListener('pointerdown', e => {
  if (mode !== 'play' || busy || !S || S.status !== 'place') return;
  const ti = nearestDie(e.clientX, e.clientY);
  if (ti == null) { closePop(); return; }
  canvas.setPointerCapture(e.pointerId);
  drag = { ti, id: e.pointerId, sx: e.clientX, sy: e.clientY, active: false, tgt: null, lastX: e.clientX };
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.active && Math.hypot(dx, dy) > 8) {
    drag.active = true; closePop(); sfx.pick(); vibrate(8);
    const v = trayViews[drag.ti]; v.state = 'drag';
    tween(140, e2 => v.g.scale.setScalar(1 + 0.25 * e2), E.outBack);
  }
  if (drag.active) moveDrag(e.clientX, e.clientY);
});
const _p = new THREE.Vector3();
function moveDrag(x, y) {
  const v = trayViews[drag.ti];
  screenToPlane(x, y - DRAG_OFFSET, 0.75, _p);
  v.g.position.lerp(_p, 0.6);
  const vx = x - drag.lastX; drag.lastX = x;
  v.mesh.quaternion.copy(v.rest).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, clamp(-vx * 0.03, -0.6, 0.6))));
  // target from die position projected onto board plane
  const sp = toScreen(_p); const bp = screenToPlane(sp.x, sp.y, 0, new THREE.Vector3());
  let tgt = null;
  if (bp.y > -0.4) {
    const cx = Math.round(bp.x + (S.w - 1) / 2), cy = Math.floor(bp.y);
    tgt = L.targetFor(S, cx, cy);
  }
  drag.tgt = tgt; showPreview(drag.ti, tgt);
}
function endDrag(e, cancel = false) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  const v = trayViews[d.ti];
  if (!d.active) { if (!cancel) openDiePop(d.ti); return; }
  const tgt = d.tgt;
  const ok = !cancel && tgt && preview && preview.ok && preview.key === `${tgt.kind}${tgt.x},${tgt.y}`;
  if (ok) { v.g.scale.setScalar(1); commit(d.ti, tgt); return; }
  hidePreview();
  if (tgt) sfx.nope();
  v.state = 'returning';
  const from = v.g.position.clone(), s0 = v.g.scale.x;
  tween(260, e2 => { v.g.position.lerpVectors(from, v.slot, e2); v.g.scale.setScalar(lerp(s0, 1, e2)); }, E.outBack).then(() => { v.state = 'idle'; v.mesh.quaternion.copy(v.rest); });
}
canvas.addEventListener('pointerup', e => endDrag(e));
canvas.addEventListener('pointercancel', e => endDrag(e, true));

// die popover (tap)

// =============== modal system ===============
let modalOpts = {};
function openModal(html, opts = {}) {
  closeModal(); modalOpts = opts;
  const m = document.createElement('div'); m.id = 'modal'; if (opts.center) m.className = 'center';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => {
    if (e.target === m && opts.dismiss !== false) { closeModal(); return; }
    const b = e.target.closest('[data-act]'); if (b) { sfx.pop(); onAct(b.dataset.act, b.dataset); }
  });
  document.body.appendChild(m);
  return m;
}
function closeModal() { document.querySelectorAll('#modal').forEach(e => e.remove()); }
function onAct(act, ds) {
  switch (act) {
    case 'close': closeModal(); break;
    case 'undo': closeModal(); undo(); break;
    case 'giveup': closeModal(); loseSequence('Stuck!'); break;
    case 'map': closeModal(); showMap(); break;
    case 'retry': closeModal(); startLevel(level); break;
    case 'next': { const n = LEVELS[levelIndex(level.key) + 1]; closeModal(); if (n) showIntro(n); break; }
    case 'play': startLevel(LEVELS[+ds.i]); break;
    case 'collection': showCollection(ds.back ? +ds.back : null); break;
    case 'settings': showSettings(); break;
    case 'howto': showHowTo(); break;
    case 'level': showIntro(LEVELS[+ds.i]); break;
    case 'tab': showCollection(modalOpts.back, ds.tab); break;
    case 'die': showDie(+ds.id); break;
    case 'toggle-load': {
      const id = +ds.id, i = P.loadout.indexOf(id);
      if (i >= 0) { if (P.loadout.length > 1) P.loadout.splice(i, 1); else toast('Bring at least one die!'); }
      else if (P.loadout.length < P.slots) P.loadout.push(id); else toast(`Loadout is full (${P.slots} slots)`);
      save(); showDie(id); break;
    }
    case 'set-emp': {
      const d = dieById(+ds.id), e = ds.emp || null;
      if (e && empAvail(e) <= 0 && d.emp !== e) { toast('None left. Buy more in the shop!'); break; }
      d.emp = e; save(); sfx.coin(); showDie(d.id); break;
    }
    case 'buy-die': {
      const t = ds.type, price = DIE_INFO[t].price; if (P.gems < price) { toast('Not enough gems'); sfx.nope(); break; }
      P.gems -= price; const d = { id: P.nextDie++, type: t, emp: null }; P.dice.push(d); if (P.loadout.length < P.slots) P.loadout.push(d.id);
      save(); sfx.coin(); toast(`Bought a ${DIE_INFO[t].name}!`); showCollection(modalOpts.back, 'shop'); break;
    }
    case 'buy-emp': {
      const e = ds.emp, price = EMPS[e].price; if (P.gems < price) { toast('Not enough gems'); sfx.nope(); break; }
      P.gems -= price; P.emps[e] = (P.emps[e] || 0) + 1; save(); sfx.coin(); toast(`Got ${EMPS[e].name}! Attach it to a die.`); showCollection(modalOpts.back, 'shop'); break;
    }
    case 'back-intro': showIntro(LEVELS[+ds.i]); break;
    case 'set': {
      const k = ds.key;
      if (k === 'quality') P.settings.quality = P.settings.quality === 'high' ? 'low' : 'high';
      else P.settings[k] = !P.settings[k];
      save(); applyAudio(); applyQuality(); showSettings(); break;
    }
    case 'reset': {
      if (ds.confirm) { localStorage.removeItem(SAVE_KEY); P = defaultProfile(); save(); closeModal(); showMap(); toast('Progress reset'); }
      else { const b = document.querySelector('[data-act="reset"]'); b.dataset.confirm = '1'; b.textContent = 'Tap again to confirm'; }
      break;
    }
  }
  if (mode === 'map' && ['buy-die', 'buy-emp', 'set-emp', 'toggle-load'].includes(act)) renderMapTop();
}

function teachPanel(p) {

  if (p.band != null) s += `<rect x="1" y="${top + p.band * cs - 1}" width="${W - 2}" height="${cs + 2}" rx="7" fill="none" stroke="#ffd23f" stroke-width="3"><animate attributeName="opacity" values="1;.4;1" dur="1.2s" repeatCount="indefinite"/></rect>`;
  rows.forEach((row, r) => row.forEach((t, c) => {

    if (t === 'x') { s += `<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="5" fill="#3c3274" stroke="#fff" stroke-dasharray="3 3" stroke-width="1.5"/><text x="${x + w / 2}" y="${y + w / 2 + 5}" text-anchor="middle" font-size="14" fill="#ffe066">✦</text>`; return; }
    if (t === '#') { s += `<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="5" fill="#1a1433"/><path d="M${x + 4} ${y + w - 2}L${x + w - 2} ${y + 4}M${x + 2} ${y + w / 2}L${x + w / 2} ${y + 2}M${x + w / 2} ${y + w - 2}L${x + w - 2} ${y + w / 2}" stroke="#3c3274" stroke-width="2"/>`; return; }
    if (t === 'S') { s += `<path d="M${x + 3} ${y + w - 3}l3-${w - 10} ${w / 2 - 4}-5 ${w / 2 - 2} 6-1 ${w - 10}z" fill="#9a93ad" stroke="#6f6886"/>`; return; }
    let v = t, ice = false, hi = false, bomb = false;

    s += `<text x="${x + w / 2}" y="${y + w / 2 + 5}" text-anchor="middle" font-family="Fredoka,system-ui" font-weight="700" font-size="${v.length > 1 ? 12 : 14}" fill="#fff">${v}</text>`;
    if (bomb) s += `<circle cx="${x + w - 4}" cy="${y + 4}" r="5" fill="#2b2235"/><path d="M${x + w - 1} ${y + 1}l3 -4" stroke="#ff9a3c" stroke-width="2"/>`;
    if (ice) s += `<rect x="${x - 1}" y="${y - 1}" width="${w + 2}" height="${w + 2}" rx="6" fill="#cdefff" fill-opacity=".45" stroke="#fff" stroke-width="1.5"/>`;
  }));

// line-ready bands
const bands = new Map();
const bandMat = () => { const m = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }); m.color.setRGB(2.2, 1.7, 0.4); return m; };
function clearBands() { for (const g of bands.values()) boardGroup.remove(g); bands.clear(); }
function updateBands(announce = true) {
  if (!S) return;
  const lines = L.findLines(S), keys = new Set(lines.map(l => l.dir + l.i));
  for (const [k, g] of bands) if (!keys.has(k)) { boardGroup.remove(g); bands.delete(k); }
  for (const l of lines) {
    const k = l.dir + l.i; if (bands.has(k)) continue;
    const g = new THREE.Group(), m = bandMat(), t = 0.07;
    const len = l.dir === 'row' ? S.w + 0.12 : S.h + 0.12;
    const bar = (x, y, w, h) => { const b = new THREE.Mesh(G.plane, m); b.position.set(x, y, 0); b.scale.set(w, h, 1); g.add(b); };
    if (l.dir === 'row') { g.position.set(0, l.i + 0.5, 0.47); bar(0, 0.5, len, t); bar(0, -0.5, len, t); bar(-len / 2, 0, t, 1 + t); bar(len / 2, 0, t, 1 + t); }
    else { g.position.set(l.i - (S.w - 1) / 2, S.h / 2, 0.47); bar(0.5, 0, t, len); bar(-0.5, 0, t, len); bar(0, -len / 2, 1 + t, t); bar(0, len / 2, 1 + t, t); }
    g.userData.mat = m; boardGroup.add(g); bands.set(k, g);
    if (announce) {
      const end = l.dir === 'row' ? new THREE.Vector3(S.w / 2 - 0.5, l.i + 1.1, 0.6) : new THREE.Vector3(l.i - (S.w - 1) / 2, S.h + 0.4, 0.6);
      floatText('LINE READY', end, { color: '#ffe066', size: 18 }); sfx.star(0);
      if (!P.seen.primed) { P.seen.primed = 1; save(); toast('Full line! Now make a match that touches it to clear the whole line for a bonus.', 4200); }
    }

}

    <h1>${DIE_INFO[d.type].name}</h1><div class="sub">${DIE_INFO[d.type].role} · rolls 1–${L.SIDES[d.type]}</div>
    <div class="actions" style="margin-top:4px"><button class="btn ${inL ? 'ghost' : 'teal'}" data-act="toggle-load" data-id="${id}">${inL ? 'Remove from loadout' : 'Add to loadout'}</button></div>
    <h3>Empowerment slot</h3>
    <button class="choice ${!d.emp ? 'on' : ''}" data-act="set-emp" data-id="${id}" data-emp=""><div class="emp-ico" style="background:#cfc7dd">–</div>None</button>
    ${P.unlockedEmps.map(e => { const av = empAvail(e) + (d.emp === e ? 1 : 0); return `<button class="choice ${d.emp === e ? 'on' : ''}" data-act="set-emp" data-id="${id}" data-emp="${e}" ${av <= 0 ? 'disabled' : ''}>${empIcon(e, 36)}<div style="flex:1"><b>${EMPS[e].name}</b><div style="font-size:12px;color:var(--ink2);font-weight:500">${EMPS[e].desc}</div></div><span>${av} free</span></button>`; }).join('') || '<div class="tip">No empowerments yet. Beat 1-2 to earn your first.</div>'}
    <div class="actions"><button class="btn" data-act="collection" ${back != null ? `data-back="${back}"` : ''}>Back</button></div>`, { back });
}
function showSettings() {
  const sw = (k, on, label) => `<div class="toggle" data-act="set" data-key="${k}"><span>${label}</span><div class="sw ${on ? 'on' : ''}"></div></div>`;
  openModal(`<h1>Settings</h1>
    ${sw('sound', P.settings.sound, 'Sound effects')}${sw('music', P.settings.music, 'Music')}
    ${sw('reduced', P.settings.reduced, 'Reduced motion (no shake)')}${sw('quality', P.settings.quality === 'high', 'High quality effects')}
    <div class="actions"><button class="btn ghost small" data-act="reset">Reset progress</button><button class="btn" data-act="close">Done</button></div>`, { center: true });
}
function renderMapTop() {
  const el = document.querySelector('.map-top .gems'); if (el) el.innerHTML = `${ICON.gem} ${P.gems}`;
}
let mapDice = [];
function showMap() {
  mode = 'map'; S = null; level = null; closeModal(); closePop(); hint('');
  $('#hud').classList.add('hidden'); $('#bottombar').classList.add('hidden');
  views.clear(); clearGroup(boardGroup); bands.clear(); clearTray(); hidePreview(); clearGroup(fxGroup); parts.length = 0;
  // pick theme of furthest unlocked world
  let furthest = 0; LEVELS.forEach((l, i) => { if (levelUnlocked(i)) furthest = i; });
  buildWorld(themeForLevel(LEVELS[furthest]), 0, 0);
  mapDice.forEach(m => scene.remove(m.g));
  mapDice = ['d4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd2'].map((t, i) => {
    const v = makeDieView({ type: t, value: 1 + (i * 3) % L.SIDES[t], emp: i % 3 === 0 ? Object.keys(EMPS)[i % 5] : null, sides: L.SIDES[t] });
    trayGroup.remove(v.g); scene.add(v.g); v.badge.visible = false; v.orbit = { r: rand(3.2, 4.6), a: (i / 7) * Math.PI * 2, y: rand(1.2, 3.8), sp: rand(0.15, 0.3) };
    return v;
  });
  fitCamera();
  const totalStars = Object.values(P.stars).reduce((a, b) => a + b, 0);
  const html = [`<div class="map-inner"><div class="map-top"><span class="pill gems">${ICON.gem} ${P.gems}</span><span class="pill">${ICON.star(true).replace('<svg', '<svg width="20" height="20"')} ${totalStars}</span><span style="flex:1"></span>
    <button class="icon-btn" data-act="howto" aria-label="How to play">?</button><button class="icon-btn" data-act="collection" aria-label="Dice">${ICON.dice}</button><button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>
    <div class="logo">${'DICE'.split('').map((c, i) => `<span style="animation-delay:${i * 0.12}s">${c}</span>`).join('')} ${'DROP'.split('').map((c, i) => `<span style="animation-delay:${(i + 4) * 0.12}s">${c}</span>`).join('')}</div>
    <div class="tagline">Roll. Drop. Match. Burst!</div>`];
  const nextIdx = LEVELS.findIndex((l, i) => levelUnlocked(i) && !P.stars[l.key]);
  for (const ch of CHAPTERS) {
    const lvls = LEVELS.map((l, i) => [l, i]).filter(([l]) => l.chapter === ch.n), th = themeOf(ch.n);
    const chStars = lvls.reduce((a, [l]) => a + (P.stars[l.key] || 0), 0);
    html.push(`<div class="world"><span class="tag" style="background:${th.tag}">Chapter ${ch.n} · ${esc(th.label || '')}</span><h2>${esc(ch.name)}</h2><p>${esc(ch.blurb)} · ★ ${chStars}/${lvls.length * 3}</p><div class="path">`);
    lvls.forEach(([l, i], k) => {
      const un = levelUnlocked(i), st = P.stars[l.key] || 0;
      const off = Math.sin(k * 1.1) * 90;
      const cls = !un ? 'locked' : i === nextIdx ? 'next' : st ? 'won' : '';
      const boss = l.boss;
      html.push(`<div class="node-row" style="transform:translateX(${off}px)"><button class="node ${cls}" ${un ? `data-act="level" data-i="${i}"` : ''}>${un ? l.slot : '<svg viewBox="0 0 24 24" width="24" height="24"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>'}${boss ? '<span class="boss">BOSS</span>' : ''}${un ? `<span class="stars">${[0, 1, 2].map(s => ICON.star(s < st)).join('')}</span>` : ''}</button></div>`);
    });
    html.push(`</div></div>`);
  }
  html.push(`<div class="world" style="text-align:center"><h2>More chapters coming</h2><p>Volcano, Clockwork, Crystal Caves, Reef, Desert and the Void, with D10, D12 and D20.</p></div></div>`);
  const sc = $('#screen-map'); sc.innerHTML = html.join(''); sc.classList.remove('hidden');
  if (!sc._wired) {
    sc._wired = true;
    sc.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) { sfx.pop(); onAct(b.dataset.act, b.dataset); } });
  }
  if (nextIdx >= 0) setTimeout(() => { const n = sc.querySelector('.node.next'); if (n && n.scrollIntoView && LEVELS[nextIdx].id !== '1-1') n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 200);
}

// =============== main loop ===============
let last = performance.now(), T = 0;
const tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  timeScale = now < hitstopUntil ? 0.03 : 1;
  const sdt = dt * timeScale;
  updateTweens(sdt);
  updateParts(sdt);
  // world idle
  for (const c of world.clouds) { c.o.position.x += c.sp * dt; if (c.o.position.x > 14) c.o.position.x = -14; }
  for (const p of world.props) {
    if (p.kind === 'sway') p.o.rotation.z = Math.sin(T * 1.3 + p.ph) * 0.04;
    else if (p.kind === 'bob') p.o.position.y = p.y + Math.sin(T * 0.7 + p.ph) * 0.25;
    else if (p.kind === 'spin') p.o.rotation.y += dt * 0.8;
    else if (p.kind === 'lava') p.o.material.emissiveIntensity = 1.4 + 0.5 * Math.sin(T * 1.5 + p.ph);
  }
  for (const g of world.gems) { g.rotation.y += dt * 1.5; g.position.y += Math.sin(T * 2) * 0.002; }
  if (world.points) {
    const a = world.points.geometry.attributes.position, th = world.theme;
    for (let i = 0; i < a.count; i++) {
      let y = a.getY(i) - th.fall * dt * (0.6 + (i % 5) * 0.15), x = a.getX(i) + (th.drift || 0) * dt + Math.sin(T * 0.6 + i) * dt * (th.firefly ? 0.5 : 0.12);
      if (th.firefly) y += Math.cos(T * 0.8 + i * 1.7) * dt * 0.3;
      if (y > 13) y = -4; if (y < -4) y = 13; if (x > 11) x = -11; if (x < -11) x = 11;
      a.setY(i, y); a.setX(i, x);
    }
    a.needsUpdate = true;
    if (th.firefly) world.points.material.opacity = 0.6 + 0.35 * Math.sin(T * 2.3);
  }
  for (const r of world.ribbons || []) {
    const pa = r.geometry.attributes.position, b = r.userData.base;
    for (let i = 0; i < pa.count; i++) pa.setY(i, b[i * 3 + 1] + Math.sin(b[i * 3] * 0.35 + T * 0.6 + r.userData.ph) * 0.9);
    pa.needsUpdate = true; r.material.opacity = 0.3 + 0.18 * Math.sin(T * 0.5 + r.userData.ph);
  }
  bgU.glow.value = Math.max(0, bgU.glow.value - dt * 0.8);
  // blocks idle: preview glow, blaze flames, ice shimmer
  for (const v of views.values()) {
    if (v.glow && v.k === 'n') { v.body.material.emissive.set('#ffffff'); v.body.material.emissiveIntensity = 0.25 + 0.2 * Math.sin(T * 10); }
    if (v.blaze && Math.random() < dt * 6) spawnSparks(v.g.position.clone().add(new THREE.Vector3(rand(-0.3, 0.3), 0.35, 0.3)), Math.random() < 0.5 ? '#ff7a1a' : '#ffd23f', 1, 0.4, 0.3, 0.6, -1.6);
    if (v.ice) v.ice.children[0].material.emissiveIntensity = 0.25 + 0.1 * Math.sin(T * 2 + v.id);
    if (v.k === 'w') v.body.material.emissive.setHSL((T * 0.25 + v.id * 0.13) % 1, 1, 0.5);
    if (v.bombParts) {
      v.bombParts.spark.scale.setScalar(0.26 + Math.random() * 0.14);
      if (v.bomb <= 1 && !v.glow && v.k === 'n') { v.body.material.emissive.set('#ff1a3a'); v.body.material.emissiveIntensity = 0.35 + 0.35 * Math.sin(T * 12); }
      if (Math.random() < dt * 5) spawnSparks(v.g.position.clone().add(new THREE.Vector3(0.31, 0.7, 0.2)), '#ffb030', 1, 0.6, 0.18, 0.35, 1.5);
    }
  }
  for (const g of bands.values()) g.userData.mat.opacity = 0.55 + 0.45 * Math.sin(T * 5);
  if (ghost.visible) { const s = (preview && preview.tgt && preview.tgt.kind === 'stack' ? 1.08 : 1) + Math.sin(T * 8) * 0.03; ghost.scale.setScalar(s); ghostBody.material.opacity = 0.45 + 0.15 * Math.sin(T * 8); ghost2Body.material.opacity = ghostBody.material.opacity; }
  // tray dice idle
  trayViews.forEach((v, i) => {
    if (!v) return;
    if (v.aura) { v.aura.material.opacity = 0.55 + 0.25 * Math.sin(T * 3 + v.ph); v.aura.scale.setScalar(1.5 + 0.12 * Math.sin(T * 3 + v.ph)); }
    if (v.state === 'idle' && mode === 'play') {
      v.g.position.y = v.slot.y + Math.sin(T * 2 + v.ph) * 0.035;
      tmpE.set(Math.sin(T * 1.3 + v.ph) * 0.06, Math.sin(T * 0.9 + v.ph) * 0.12, 0); v.mesh.quaternion.copy(v.rest).multiply(tmpQ.setFromEuler(tmpE));
      if (v.d.emp === 'blazing' && Math.random() < dt * 4) spawnSparks(v.g.position, '#ff7a1a', 1, 0.4, 0.3, 0.5, -1.4);
    }
  });
  for (const v of mapDice) {
    v.orbit.a += dt * v.orbit.sp;
    v.g.position.set(Math.cos(v.orbit.a) * v.orbit.r, v.orbit.y + Math.sin(T + v.orbit.a * 3) * 0.3, Math.sin(v.orbit.a) * v.orbit.r * 0.6);
    v.mesh.rotation.x += dt * 0.7; v.mesh.rotation.y += dt * 0.9;
    if (v.aura) v.aura.material.opacity = 0.5 + 0.3 * Math.sin(T * 3 + v.ph);
  }
  // camera
  shake *= Math.exp(-dt * 9);
  if (mode === 'map') {
    const a = T * 0.12; const r = camBase.pos.z;
    camera.position.set(Math.sin(a) * r * 0.35, camBase.pos.y, Math.cos(a * 0.7) * 1.5 + r * 0.95);
    camera.lookAt(camBase.look);
  } else {
    camera.position.copy(camBase.pos);
    if (shake > 0.002) camera.position.add(new THREE.Vector3(rand(-1, 1) * shake, rand(-1, 1) * shake, 0));
    camera.lookAt(camBase.look);
  }
  if (composer && P.settings.quality === 'high') composer.render(); else renderer.render(scene, camera);
}

// =============== boot ===============
window.__dd = { get S() { return S; }, startLevel, doRoll, commit, undo, showMap, LEVELS, L, get busy() { return busy; }, P: () => P };
applyQuality();
showMap();
requestAnimationFrame(frame);
setTimeout(() => { const ld = $('#loading'); if (ld) { ld.style.transition = 'opacity .4s'; ld.style.opacity = 0; setTimeout(() => ld.remove(), 400); } }, 300);

</script>
